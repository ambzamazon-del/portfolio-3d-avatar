<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Avatar</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

import { GLTFLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js"


/* --------------------------------
   SCENE
-------------------------------- */

const scene = new THREE.Scene()


/* --------------------------------
   CAMERA
-------------------------------- */

const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.1,
    100
)

camera.position.set(
    0,
    1.2,
    3
)


/* --------------------------------
   RENDERER
-------------------------------- */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
})

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
)

renderer.setSize(
    window.innerWidth,
    window.innerHeight
)

renderer.outputColorSpace =
    THREE.SRGBColorSpace

renderer.setAnimationLoop(animate)

document.body.appendChild(
    renderer.domElement
)


/* --------------------------------
   LIGHTING
-------------------------------- */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        1.5
    )

scene.add(ambientLight)


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    )

keyLight.position.set(
    2,
    4,
    3
)

scene.add(keyLight)


/* --------------------------------
   AVATAR
-------------------------------- */

const loader = new GLTFLoader()

let avatar = null

loader.load(
    "./model.glb",

    (gltf) => {

        avatar = gltf.scene

        avatar.position.set(
            0,
            -1.5,
            0
        )

        avatar.scale.set(
            1,
            1,
            1
        )

        scene.add(avatar)

        console.log(
            "Avatar loaded successfully"
        )

    },

    undefined,

    (error) => {

        console.error(
            "Avatar failed to load:",
            error
        )

    }
)


/* --------------------------------
   MOUSE
-------------------------------- */

const mouse = {
    x: 0,
    y: 0
}

window.addEventListener(
    "pointermove",
    (event) => {

        mouse.x =
            (event.clientX /
                window.innerWidth) *
            2 - 1

        mouse.y =
            (event.clientY /
                window.innerHeight) *
            2 - 1

    }
)


/* --------------------------------
   ANIMATION
-------------------------------- */

function animate() {

    if (avatar) {

        const targetRotationY =
            mouse.x * 0.15

        const targetRotationX =
            mouse.y * 0.06

        avatar.rotation.y +=
            (
                targetRotationY -
                avatar.rotation.y
            ) * 0.05

        avatar.rotation.x +=
            (
                targetRotationX -
                avatar.rotation.x
            ) * 0.05
    }

    renderer.render(
        scene,
        camera
    )
}


/* --------------------------------
   RESIZE
-------------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight

        camera.updateProjectionMatrix()

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        )

    }
)

</script>

</body>
</html>
